<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

  --line:rgba(255,255,255,0.055);--line2:rgba(255,255,255,0.1);--line3:rgba(255,255,255,0.18);
  --text:#eeeef2;--text2:#8888a0;--text3:#44445a;
  --acc:#7c6ef7;--acc2:#a594ff;--accbg:rgba(124,110,247,0.08);--accbd:rgba(124,110,247,0.22);
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;
  --r:7px;--font:'Geist',system-ui,sans-serif;--mono:'Geist Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
